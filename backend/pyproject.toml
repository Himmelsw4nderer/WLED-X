[project]
name = "wled-x"
version = "0.1.0"
description = "WLED-based lighting controller: device discovery, audio-reactive node-graph effects, 3D fixture layout, live console"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "zeroconf>=0.140",
    "httpx>=0.27",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "pydantic-settings>=2.6",
    "websockets>=13.1",
]

[project.scripts]
wled-x = "wled_x.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's `Depends(...)` default-argument pattern is the idiomatic DI mechanism, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
